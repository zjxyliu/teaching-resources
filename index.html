<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教学资源导航</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --panel: #ffffff;
            --text: #1f2a37;
            --muted: #5f6b7a;
            --primary: #2563eb;
            --primary-soft: #e8efff;
            --primary-hover: #1d4ed8;
            --border: #d9e0ea;
            --shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            color: var(--text);
            background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 45%, var(--bg) 100%);
            min-height: 100vh;
        }

        .page {
            width: min(1100px, 94vw);
            margin: 32px auto 42px;
        }

        .header {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
        }

        .title {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .toolbar {
            margin-top: 16px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
        }

        .search {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .meta {
            color: var(--muted);
            font-size: 13px;
            white-space: nowrap;
        }

        .subjects {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .subject-btn {
            border: 1px solid #c8d4ff;
            background: #ffffff;
            color: #1f3b8d;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
        }

        .subject-btn.active {
            background: var(--primary-soft);
            border-color: #99b4ff;
            color: #13317d;
            font-weight: 600;
        }

        .layout {
            margin-top: 16px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .chapter {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }

        .chapter-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .chapter-title {
            margin: 0;
            font-size: 18px;
        }

        .chapter-count {
            color: var(--muted);
            font-size: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
        }

        .card {
            background: #fff;
            border: 1px solid #dde5f0;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .breadcrumb {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
        }

        .name {
            margin: 0;
            font-size: 17px;
        }

        .desc {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
            min-height: 36px;
        }

        .file {
            font-size: 12px;
            color: #64748b;
            background: #f8fafc;
            border: 1px dashed #d4dbe6;
            border-radius: 8px;
            padding: 6px 8px;
            overflow-wrap: anywhere;
        }

        .actions {
            margin-top: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            border: 1px solid transparent;
            border-radius: 9px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.12s, background-color 0.2s, border-color 0.2s;
            user-select: none;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #eef2ff;
            color: #233876;
            border-color: #c8d4ff;
        }

        .btn-secondary:hover {
            background: #e0e7ff;
        }

        .empty {
            margin-top: 14px;
            padding: 18px;
            text-align: center;
            color: var(--muted);
            background: #fff;
            border: 1px dashed var(--border);
            border-radius: 12px;
            display: none;
        }

        .recent {
            margin-top: 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
        }

        .recent-title {
            margin: 0 0 8px;
            font-size: 14px;
        }

        .recent-list {
            margin: 0;
            padding-left: 18px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 680px) {
            .toolbar {
                grid-template-columns: 1fr;
            }

            .meta {
                white-space: normal;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="header">
            <h1 class="title">教学资源导航</h1>
            <p class="subtitle">采用“学科 → 章节 → 页面”模式组织资源。当前已接入大学物理，并预留教学论扩展位。</p>
            <div class="toolbar">
                <input id="searchInput" class="search" type="search" placeholder="搜索名称、章节、关键词..." />
                <span id="countMeta" class="meta">共 0 个资源</span>
            </div>
            <div id="subjectTabs" class="subjects"></div>
        </section>

        <section id="chapterLayout" class="layout"></section>
        <section id="emptyState" class="empty">当前筛选条件下没有匹配资源，请调整搜索词或切换学科。</section>

        <section class="recent">
            <h2 class="recent-title">最近访问</h2>
            <ol id="recentList" class="recent-list"></ol>
        </section>
    </main>

    <script>
        const catalog = [
            {
                id: "university-physics",
                subject: "大学物理",
                description: "基础物理课程演示资源",
                chapters: [
                    {
                        id: "rotation",
                        title: "第3章 刚体转动与角动量",
                        resources: [
                            {
                                id: "torque",
                                title: "力矩演示",
                                file: "resources/大学物理/03-刚体转动/力矩.html",
                                description: "展示力矩与转动效果，适合讲解力和支点关系。",
                                keywords: ["力矩", "转动", "杠杆"]
                            },
                            {
                                id: "angular-momentum",
                                title: "角动量演示（矢量）",
                                file: "resources/大学物理/03-刚体转动/角动量演示(矢量）.html",
                                description: "可视化角动量矢量变化，帮助理解方向和大小关系。",
                                keywords: ["角动量", "矢量", "旋转"]
                            }
                        ]
                    },
                    {
                        id: "kepler",
                        title: "第4章 万有引力与开普勒定律",
                        resources: [
                            {
                                id: "kepler-orbit",
                                title: "开普勒轨道模拟（优化版）",
                                file: "resources/大学物理/04-万有引力与开普勒定律/开普勒轨道模拟（优化版）.html",
                                description: "基于开普勒定律与面积速度，展示轨道运动过程。",
                                keywords: ["开普勒", "轨道", "天体运动", "行星"]
                            }
                        ]
                    }
                ]
            },
            {
                id: "pedagogy",
                subject: "教学论",
                description: "预留：后续接入教学论课程资源",
                chapters: []
            }
        ];

        const storageKey = "teaching_resource_recent_visits_v2";
        const searchInput = document.getElementById("searchInput");
        const countMeta = document.getElementById("countMeta");
        const subjectTabs = document.getElementById("subjectTabs");
        const chapterLayout = document.getElementById("chapterLayout");
        const emptyState = document.getElementById("emptyState");
        const recentList = document.getElementById("recentList");
        let activeSubjectId = catalog[0]?.id || "";

        function flattenSubject(subject) {
            return subject.chapters.flatMap((chapter) =>
                chapter.resources.map((resource) => ({
                    ...resource,
                    subject: subject.subject,
                    chapter: chapter.title,
                    chapterId: chapter.id
                }))
            );
        }

        function getSubjectById(subjectId) {
            return catalog.find((subject) => subject.id === subjectId);
        }

        function getResourceCount(subject) {
            return flattenSubject(subject).length;
        }

        function readRecent() {
            try {
                const data = JSON.parse(localStorage.getItem(storageKey) || "[]");
                return Array.isArray(data) ? data : [];
            } catch (err) {
                return [];
            }
        }

        function writeRecent(item) {
            const current = readRecent().filter((v) => v.file !== item.file);
            const next = [{ ...item, at: new Date().toLocaleString() }, ...current].slice(0, 8);
            localStorage.setItem(storageKey, JSON.stringify(next));
            renderRecent();
        }

        function openResource(item, newTab) {
            writeRecent(item);
            if (newTab) {
                window.open(item.file, "_blank", "noopener");
            } else {
                window.location.href = item.file;
            }
        }

        function createCard(item) {
            const card = document.createElement("article");
            card.className = "card";
            card.innerHTML = `
                <p class="breadcrumb">${item.subject} / ${item.chapter}</p>
                <h3 class="name">${item.title}</h3>
                <p class="desc">${item.description}</p>
                <div class="file">${item.file}</div>
                <div class="actions">
                    <button class="btn btn-primary" type="button">打开</button>
                    <button class="btn btn-secondary" type="button">新标签页</button>
                </div>
            `;
            const [openBtn, openNewTabBtn] = card.querySelectorAll("button");
            openBtn.addEventListener("click", () => openResource(item, false));
            openNewTabBtn.addEventListener("click", () => openResource(item, true));
            return card;
        }

        function renderSubjectTabs() {
            subjectTabs.innerHTML = "";
            catalog.forEach((subject) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = `subject-btn${subject.id === activeSubjectId ? " active" : ""}`;
                button.textContent = `${subject.subject}（${getResourceCount(subject)}）`;
                button.title = subject.description;
                button.addEventListener("click", () => {
                    activeSubjectId = subject.id;
                    renderAll();
                });
                subjectTabs.appendChild(button);
            });
        }

        function renderChapters(query) {
            const subject = getSubjectById(activeSubjectId);
            if (!subject) {
                chapterLayout.innerHTML = "";
                countMeta.textContent = "共 0 个资源";
                emptyState.style.display = "block";
                return;
            }

            const q = query.trim().toLowerCase();
            let visibleCount = 0;
            chapterLayout.innerHTML = "";

            if (!subject.chapters.length) {
                countMeta.textContent = `学科：${subject.subject}（0 个资源）`;
                emptyState.style.display = "block";
                emptyState.textContent = `${subject.subject} 暂无页面，后续可按“章节 -> 页面”方式继续扩展。`;
                return;
            }

            subject.chapters.forEach((chapter) => {
                const resources = chapter.resources.filter((resource) => {
                    const text = `${subject.subject} ${chapter.title} ${resource.title} ${resource.file} ${resource.keywords.join(" ")}`.toLowerCase();
                    return text.includes(q);
                });

                if (!resources.length) {
                    return;
                }

                visibleCount += resources.length;
                const chapterSection = document.createElement("section");
                chapterSection.className = "chapter";
                chapterSection.innerHTML = `
                    <div class="chapter-header">
                        <h2 class="chapter-title">${chapter.title}</h2>
                        <span class="chapter-count">${resources.length} 个页面</span>
                    </div>
                    <div class="grid"></div>
                `;

                const grid = chapterSection.querySelector(".grid");
                resources.forEach((resource) => {
                    const merged = {
                        ...resource,
                        subject: subject.subject,
                        chapter: chapter.title
                    };
                    grid.appendChild(createCard(merged));
                });

                chapterLayout.appendChild(chapterSection);
            });

            countMeta.textContent = `学科：${subject.subject}，显示 ${visibleCount} / ${getResourceCount(subject)} 个资源`;
            emptyState.style.display = visibleCount ? "none" : "block";
            if (!visibleCount) {
                emptyState.textContent = "当前筛选条件下没有匹配资源，请调整搜索词或切换学科。";
            }
        }

        function renderRecent() {
            const recent = readRecent();
            recentList.innerHTML = "";
            if (!recent.length) {
                const li = document.createElement("li");
                li.textContent = "暂无访问记录";
                recentList.appendChild(li);
                return;
            }

            recent.forEach((item) => {
                const li = document.createElement("li");
                const link = document.createElement("a");
                link.href = item.file;
                link.textContent = `${item.subject} / ${item.chapter} / ${item.title}（${item.at}）`;
                link.addEventListener("click", () => writeRecent(item));
                li.appendChild(link);
                recentList.appendChild(li);
            });
        }

        function renderAll() {
            renderSubjectTabs();
            renderChapters(searchInput.value);
            renderRecent();
        }

        searchInput.addEventListener("input", renderAll);
        renderAll();
    </script>
</body>
</html>
